services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: psicossocial
      POSTGRES_USER: inseg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inseg}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inseg -d psicossocial"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://inseg:${POSTGRES_PASSWORD:-inseg}@db:5432/psicossocial
      SECRET_KEY: ${SECRET_KEY:-change-me-production-inseg}
      DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@inseg.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-inseg123}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Admin Inseg}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_ORCHESTRATOR_MODEL: ${OPENROUTER_ORCHESTRATOR_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-google/gemini-2.5-flash}
    volumes:
      - appdata:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
